services:
  main:
    image: ghcr.io/capstone-audissey-fall-2026/audyssey-main:latest
    build:
      context: .
      dockerfile: docker/main.Dockerfile
    ports: ["127.0.0.1:8600:8600"]
    env_file: .env
    environment:
      AUDYSSEY_PLANNER: ${AUDYSSEY_PLANNER:-real}
      AUDYSSEY_PLANNER_BASE_URL: ${AUDYSSEY_PLANNER_BASE_URL:-http://vllm:8000/v1}
      AUDYSSEY_PLANNER_MODEL: ${AUDYSSEY_PLANNER_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      AUDYSSEY_PLANNER_API_KEY: ${AUDYSSEY_PLANNER_API_KEY:-${GOOGLE_API_KEY:-}}
      AUDYSSEY_SEPARATOR: ${AUDYSSEY_SEPARATOR:-remote}
      AUDYSSEY_SEPARATOR_URL: ${AUDYSSEY_SEPARATOR_URL:-http://separation:8700}
      AUDYSSEY_FILTER: ${AUDYSSEY_FILTER:-remote}
      AUDYSSEY_FILTER_URL: ${AUDYSSEY_FILTER_URL:-http://judge:8700}
      AUDYSSEY_GROUNDER: ${AUDYSSEY_GROUNDER:-remote}
      AUDYSSEY_GROUNDING_URL: ${AUDYSSEY_GROUNDING_URL:-http://grounding:8700}
      AUDYSSEY_WORK_DIR: /app/work/jobs
    volumes: ["jobs:/app/work/jobs"]

  separation:
    image: ghcr.io/capstone-audissey-fall-2026/audyssey-sam-audio:latest
    build:
      context: .
      dockerfile: docker/sam-audio.Dockerfile
    command: ["audyssey", "tool-server", "--tool", "separation", "--impl", "real", "--host", "0.0.0.0", "--port", "8700"]
    env_file: .env
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "0"
      AUDYSSEY_TOOL_TOKEN: ${AUDYSSEY_TOOL_TOKEN:?set AUDYSSEY_TOOL_TOKEN in .env}
    volumes: ["${HF_CACHE:-~/.cache/huggingface}:/hf:ro"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUDYSSEY_SEPARATION_GPU:-0}"]
              capabilities: [gpu]

  judge:
    image: ghcr.io/capstone-audissey-fall-2026/audyssey-sam-audio:latest
    build:
      context: .
      dockerfile: docker/sam-audio.Dockerfile
    command: ["audyssey", "tool-server", "--tool", "filtering", "--impl", "real", "--host", "0.0.0.0", "--port", "8700"]
    env_file: .env
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "0"
      AUDYSSEY_TOOL_TOKEN: ${AUDYSSEY_TOOL_TOKEN:?set AUDYSSEY_TOOL_TOKEN in .env}
    volumes: ["${HF_CACHE:-~/.cache/huggingface}:/hf:ro"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUDYSSEY_JUDGE_GPU:-0}"]
              capabilities: [gpu]

  grounding:
    image: ghcr.io/capstone-audissey-fall-2026/audyssey-sam-audio:latest
    build:
      context: .
      dockerfile: docker/sam-audio.Dockerfile
    command: ["audyssey", "tool-server", "--tool", "grounding", "--impl", "real", "--host", "0.0.0.0", "--port", "8700"]
    env_file: .env
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "0"
      AUDYSSEY_TOOL_TOKEN: ${AUDYSSEY_TOOL_TOKEN:?set AUDYSSEY_TOOL_TOKEN in .env}
    volumes: ["${HF_CACHE:-~/.cache/huggingface}:/hf:ro"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUDYSSEY_GROUNDING_GPU:-0}"]
              capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:v0.32.0
    command:
      - --model
      - ${AUDYSSEY_VLLM_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      - --gpu-memory-utilization
      - ${AUDYSSEY_VLLM_GPU_UTIL:-0.85}
      - --max-model-len
      - "8192"
    environment:
      HF_HUB_OFFLINE: "1"
    volumes: ["${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface:ro"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUDYSSEY_VLLM_GPU:-0}"]
              capabilities: [gpu]

volumes:
  jobs:
