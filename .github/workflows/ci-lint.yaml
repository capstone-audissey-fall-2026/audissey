name: ci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-format-check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: venv cache
        id: sca_data_venv_cache
        uses: actions/cache@v4
        with:
          key: cache-key-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          path: |
            ./.venv

      - name: Sync venv
        if: ${{ steps.venv-cache.outputs.cache-hit != 'true' }}
        run: |
          uv sync --dev --locked --extra ui --extra llm

      - name: lint
        run: |
          uv run ruff check --exit-non-zero-on-fix --no-cache --output-format github src/

      - name: format
        run: |
          uv run ruff format --check --no-cache --output-format github src/

      - name: type-check
        run: |
          uv run ty check --output-format github --error-on-warning src/

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: unit-tests
        run: |
          uv run python -m unittest discover tests

  numpy-1x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test Python 3.12 with numpy 1.26
        run: uv run --isolated --no-project --python 3.12 --with '.[ui,llm]' --with 'numpy==1.26.4' python -m unittest discover tests
