name: ci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-format-check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: venv cache
        id: sca_data_venv_cache
        uses: actions/cache@v4
        with:
          key: cache-key-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          path: |
            ./.venv

      - name: Sync venv
        if: ${{ steps.venv-cache.outputs.cache-hit != 'true' }}
        run: |
          uv sync --dev --locked --extra observability --extra ui

      - name: lint
        run: |
          uv run ruff check --exit-non-zero-on-fix --no-cache --output-format github src/ server/src/

      - name: format
        run: |
          uv run ruff format --check --no-cache --output-format github src/ server/src/

      - name: type-check
        run: |
          uv run ty check --output-format github --error-on-warning src/

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: unit-tests
        run: |
          uv run python -m unittest discover tests

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
