[project]
name = "audyssey-gen"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audyssey[ui]",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "numpy==2.0.2",
    "transformers==4.51.3",
    "open-clip-torch==3.3.0",
    "av==17.0.1",
    "huggingface-hub",
    # MMAudio/av-benchmark CLAP fork used by the SelSync evaluation: loads 630k-best.pt
    # with transformers>=4.31 (drops position_ids) and numpy 2.
    "laion-clap @ git+https://github.com/hkchengrex/CLAP@590b52df03a5e480634b8714135d3534313be860",
    "selva @ git+https://github.com/jnwnlee/selva@d7d40a992aab58e7cf246055681a657e5d8b4a4d",
]

[tool.uv]
package = false

[tool.uv.sources]
audyssey = { path = "..", editable = true }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
