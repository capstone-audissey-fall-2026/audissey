[project]
name = "audyssey-gpu"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "audyssey[ui]",
    "torch",
    "torchaudio",
    "torchvision",
    "torchcodec",
    # torchcodec cu128 links NVIDIA NPP, which is not part of the torch wheels.
    "nvidia-npp-cu12",
    # sam-audio@bb4c699 calls hub APIs removed in huggingface-hub 1.0 (proxies, resume_download).
    "huggingface-hub<1.0",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@2814fa619404a722d03e9a012e083e4f293a4e53",
    "opencv-python-headless>=4.11,<4.12",
    "pycocotools>=2.0.11",
    "sam-audio @ git+https://github.com/facebookresearch/sam-audio@bb4c6999d2677c7402360e426afc01ddfad6dce0",
    # Generation tool (internal model on a public base). Its CLAP scoring reuses the laion-clap fork
    # that sam-audio pins.
    "selva @ git+https://github.com/jnwnlee/selva@d7d40a992aab58e7cf246055681a657e5d8b4a4d",
]

[tool.uv]
package = false

[tool.uv.sources]
audyssey = { path = "..", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
