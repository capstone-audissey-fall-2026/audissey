[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "audyssey"
module-root = "src"

[tool.uv-build]
include = [
    "src/audyssey/devui/*.html",
]

[project]
name = "audyssey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
    "langgraph>=1.1.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "httpx>=0.27.0",
    "scipy>=1.17.1",
    "numpy>=2.4.3",
    "typer>=0.20.0",
]

[project.optional-dependencies]
llm = ["openai>=2.29.0"]
ui = [
    "fastapi>=0.136.1",
    "python-multipart>=0.0.28",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
audyssey = "audyssey.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
    "ty>=0.0.26",
]
